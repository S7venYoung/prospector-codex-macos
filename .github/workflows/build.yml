name: Build Prospector Codex macOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Swift
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Package macOS application
        run: |
          app="Prospector Codex.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp Resources/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
          cp .build/release/ProspectorCodexMacOS "$app/Contents/MacOS/ProspectorCodexMacOS"
          chmod +x "$app/Contents/MacOS/ProspectorCodexMacOS"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          <key>CFBundleDisplayName</key><string>Prospector Codex</string>
          <key>CFBundleExecutable</key><string>ProspectorCodexMacOS</string>
          <key>CFBundleIdentifier</key><string>dev.s7venyoung.prospector-codex</string>
          <key>CFBundleName</key><string>Prospector Codex</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleIconFile</key><string>AppIcon</string>
          <key>LSUIElement</key><true/>
          <key>CFBundleShortVersionString</key><string>0.1.0</string>
          <key>CFBundleVersion</key><string>${GITHUB_RUN_NUMBER}</string>
          <key>LSMinimumSystemVersion</key><string>13.0</string>
          </dict>
          </plist>
          PLIST
          codesign --deep --force --verify --verbose --sign - "$app"
          mkdir -p artifact
          hdiutil create -volname "Prospector Codex" -srcfolder "$app" -ov -format UDZO "artifact/ProspectorCodexMacOS.dmg"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProspectorCodexMacOS-macos
          path: artifact/ProspectorCodexMacOS.dmg
